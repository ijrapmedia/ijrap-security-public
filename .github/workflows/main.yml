name: Build IJRAP Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation des outils système Android
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo-dev cmake libffi-dev libssl-dev lld patch

      - name: Installation de Buildozer et Cython
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36

      - name: Compilation de l'APK Android
        run: |
          yes | buildozer -v android debug

      - name: Sauvegarde de l'APK prêt à installer
        uses: actions/upload-artifact@v4
        with:
          name: IJRAP-Security-Public-APK
          path: bin/*.apk
          
