name: Build IJRAP Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installation des dépendances système Android
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake

      - name: Installation de Buildozer et Cython
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Compilation de l'APK Android
        run: |
          yes | buildozer -v android debug

      - name: Sauvegarde de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: IJRAP-Security-Public-APK
          path: bin/*.apk
